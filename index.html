<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FP Sellection</title>
</head>
<body>
    <header>
        <img src="https://i.ibb.co/XXm7v0D/logo.png" alt="logoFp">

                <div class="content">

                        Ferrari
                    </h2>
                    <p class="description">
                        Lorem ipsum dolor sit amet consectetur adipisicing elit. 
                        Molestiae ipsa facilis, dignissimos quam itaque magnam doloribus, 
                        velit ratione cum accusantium optio omnis voluptatibus nemo, possimus

                    <button>Saiba Mais</button>
                </div>
            </div>
        </div>

        <div class="arrows">
            <button><img src="https://i.ibb.co/cNBn7pg/arrow.png" alt="seta esquerda"></button>
            <button><img src="https://i.ibb.co/cNBn7pg/arrow.png" alt="seta direita"></button>

        <div class="indicators">
            <div clas="number">01</div>
